<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <title>Animation Playground</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <!-- ===== Top toolbar ===== -->
  <header class="toolbar">
    <div class="group">
      <button class="btn" data-tool="brush" title="Brush (B)">
        <svg viewBox="0 0 24 24"><path d="M18.4 2.6a2 2 0 0 1 2.9 2.9L11.5 15.3l-2.8-2.8z"/><path d="M7.5 14.5c-2 0-3.5 1.6-3.5 3.5 0 1.2-.8 2-2 2.5 1.2.8 2.6 1 4 1 2.5 0 4.5-2 4.5-4.5z"/></svg>
        <span>Brush</span>
      </button>
      <button class="btn" data-tool="eraser" title="Eraser (E)">
        <svg viewBox="0 0 24 24"><path d="M20 20H9l-5.5-5.5a2 2 0 0 1 0-2.8l8.7-8.7a2 2 0 0 1 2.8 0l5.5 5.5a2 2 0 0 1 0 2.8L13 18.8"/><path d="m6 11 7 7"/></svg>
        <span>Eraser</span>
      </button>
      <button class="btn" data-tool="blend" title="Blend: smudge, soften or mix colors (S)">
        <svg viewBox="0 0 24 24"><path d="M12 2.7S6 9.1 6 14a6 6 0 0 0 12 0c0-4.9-6-11.3-6-11.3z"/><path d="M9.5 15a2.5 2.5 0 0 0 2.5 2.5"/></svg>
        <span>Blend</span>
      </button>
      <button class="btn" data-tool="eyedropper" title="Pick a color from the drawing (I)">
        <svg viewBox="0 0 24 24"><path d="m2 22 1-1h3l9-9"/><path d="M3 21v-3l9-9"/><path d="m15 6 3-3a2.1 2.1 0 0 1 3 3l-3 3 .5.5a1.4 1.4 0 0 1-2 2L11 6.5a1.4 1.4 0 0 1 2-2z"/></svg>
        <span>Pick color</span>
      </button>
    </div>

    <div class="divider"></div>

    <div class="group">
      <button class="btn" id="btn-settings" data-panel="panel-brush" title="Brush type and settings">
        <svg viewBox="0 0 24 24"><path d="M4 21v-7M4 10V3M12 21v-9M12 8V3M20 21v-5M20 12V3M1 14h6M9 8h6M17 16h6"/></svg>
        <span id="settings-label">Pen</span>
      </button>
      <label class="size-quick" title="Size ( [ and ] keys )">
        <span>Size</span>
        <input type="range" id="quick-size" min="0" max="100">
        <output id="quick-size-out">6</output>
      </label>
      <button class="btn" id="btn-color" data-panel="panel-color" title="Color wheel">
        <span class="swatch" id="color-swatch"></span>
        <span>Color</span>
      </button>
    </div>

    <div class="divider"></div>

    <div class="group">
      <button class="btn" id="btn-undo" title="Undo (Ctrl+Z)">
        <svg viewBox="0 0 24 24"><path d="M9 14 4 9l5-5"/><path d="M4 9h10.5a5.5 5.5 0 0 1 0 11H11"/></svg>
        <span>Undo</span>
      </button>
      <button class="btn" id="btn-redo" title="Redo (Ctrl+Y or Ctrl+Shift+Z)">
        <svg viewBox="0 0 24 24"><path d="m15 14 5-5-5-5"/><path d="M20 9H9.5a5.5 5.5 0 0 0 0 11H13"/></svg>
        <span>Redo</span>
      </button>
      <button class="btn" id="btn-clear" title="Clear the canvas (can be undone)">
        <svg viewBox="0 0 24 24"><path d="M3 6h18M8 6V4h8v2M19 6l-1 14H6L5 6"/></svg>
        <span>Clear</span>
      </button>
    </div>

    <div class="divider"></div>

    <div class="group">
      <button class="btn" id="btn-layers" data-panel="panel-layers" title="Layers">
        <svg viewBox="0 0 24 24"><path d="M12 2 2 7l10 5 10-5z"/><path d="m2 17 10 5 10-5"/><path d="m2 12 10 5 10-5"/></svg>
        <span id="layers-label">Layers</span>
      </button>
    </div>
  </header>

  <!-- ===== Drawing area ===== -->
  <main id="stage">
    <div id="canvas-wrap">
      <canvas id="canvas"></canvas>
      <canvas id="onion"></canvas>
      <div id="cursor"></div>
    </div>
  </main>

  <!-- ===== Timeline: playback and frames ===== -->
  <footer class="timeline">
    <div class="tl-group">
      <button class="btn" id="btn-play" title="Play / stop (Space)">
        <svg viewBox="0 0 24 24" id="play-icon"><path d="M7 4.5v15l12-7.5z"/></svg>
        <span id="play-label">Play</span>
      </button>
      <label class="fps" title="Playback speed in frames per second">
        <span>Speed</span>
        <input type="range" id="fps" min="1" max="30">
        <output id="fps-out">12 fps</output>
      </label>
      <button class="btn" id="btn-onion" title="Onion skin: show nearby frames faintly">
        <svg viewBox="0 0 24 24"><circle cx="9" cy="12" r="6"/><circle cx="15" cy="12" r="6"/></svg>
        <span>Onion skin</span>
      </button>
      <button class="btn btn-narrow" id="btn-onion-settings" data-panel="panel-onion" title="Onion skin settings">
        <svg viewBox="0 0 24 24"><circle cx="5" cy="12" r="1.2"/><circle cx="12" cy="12" r="1.2"/><circle cx="19" cy="12" r="1.2"/></svg>
        <span>More</span>
      </button>
    </div>

    <div class="frame-strip" id="frame-strip"></div>

    <div class="tl-group">
      <span class="frame-counter" id="frame-counter">1 / 1</span>
      <button class="btn" id="f-add" title="Add an empty frame after this one">
        <svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="M12 9v6M9 12h6"/></svg>
        <span>New frame</span>
      </button>
      <button class="btn" id="f-dup" title="Copy this frame (good for small changes)">
        <svg viewBox="0 0 24 24"><rect x="8" y="8" width="13" height="11" rx="2"/><path d="M5 15H4a1 1 0 0 1-1-1V5a2 2 0 0 1 2-2h10a1 1 0 0 1 1 1v1"/></svg>
        <span>Duplicate</span>
      </button>
      <button class="btn" id="f-del" title="Delete this frame">
        <svg viewBox="0 0 24 24"><path d="M3 6h18M8 6V4h8v2M19 6l-1 14H6L5 6"/></svg>
        <span>Delete</span>
      </button>
    </div>
  </footer>

  <!-- ===== Pop-out panel: brush / eraser settings ===== -->
  <div class="panel" id="panel-brush" hidden>
    <section id="brush-section">
      <h2>Brush type</h2>
      <div class="brush-grid" id="brush-types"></div>
      <div class="field">
        <label for="b-size">Size</label>
        <input type="range" id="b-size" min="0" max="100">
        <output id="b-size-out"></output>
      </div>
      <div class="field">
        <label for="b-opacity">Opacity</label>
        <input type="range" id="b-opacity" min="1" max="100">
        <output id="b-opacity-out"></output>
      </div>
      <div class="field">
        <label for="b-smoothing">Smoothing</label>
        <input type="range" id="b-smoothing" min="0" max="100">
        <output id="b-smoothing-out"></output>
      </div>
      <label class="check"><input type="checkbox" id="b-pressure"> Stylus pressure changes the line</label>
    </section>

    <section id="blend-section" hidden>
      <h2>Blend</h2>
      <div class="segmented" id="blend-modes">
        <button data-mode="smudge" title="Push and drag color in the direction you move">Smudge</button>
        <button data-mode="soften" title="Blur hard edges into smooth transitions">Soften</button>
        <button data-mode="mix" title="Blend neighboring colors like wet paint">Mix</button>
      </div>
      <div class="field">
        <label for="x-size">Size</label>
        <input type="range" id="x-size" min="0" max="100">
        <output id="x-size-out"></output>
      </div>
      <div class="field">
        <label for="x-strength">Strength</label>
        <input type="range" id="x-strength" min="1" max="100">
        <output id="x-strength-out"></output>
      </div>
      <div class="field">
        <label for="x-smoothing">Smoothing</label>
        <input type="range" id="x-smoothing" min="0" max="100">
        <output id="x-smoothing-out"></output>
      </div>
      <label class="check"><input type="checkbox" id="x-pressure"> Stylus pressure changes the strength</label>
    </section>

    <section id="eraser-section" hidden>
      <h2>Eraser</h2>
      <div class="field">
        <label for="e-size">Size</label>
        <input type="range" id="e-size" min="0" max="100">
        <output id="e-size-out"></output>
      </div>
      <div class="field">
        <label for="e-softness">Softness</label>
        <input type="range" id="e-softness" min="0" max="100">
        <output id="e-softness-out"></output>
      </div>
      <div class="field">
        <label for="e-smoothing">Smoothing</label>
        <input type="range" id="e-smoothing" min="0" max="100">
        <output id="e-smoothing-out"></output>
      </div>
    </section>
  </div>

  <!-- ===== Pop-out panel: layers ===== -->
  <div class="panel panel-wide" id="panel-layers" hidden>
    <h2>Layers <span class="muted" id="layer-count"></span></h2>
    <div class="mini-grid">
      <button class="mini" id="l-add" title="Add a new empty layer above the selected one">+ New layer</button>
      <button class="mini" id="l-dup" title="Make a copy of the selected layer">Duplicate</button>
      <button class="mini" id="l-merge" title="Combine the selected layer with the one below it">Merge down</button>
      <button class="mini danger" id="l-del" title="Delete the selected layer">Delete</button>
    </div>
    <ul class="layer-list" id="layer-list"></ul>
    <div class="layer-props">
      <div class="field">
        <label for="l-opacity">Opacity</label>
        <input type="range" id="l-opacity" min="0" max="100">
        <output id="l-opacity-out"></output>
      </div>
      <div class="field">
        <label for="l-blend">Blend mode</label>
        <select id="l-blend"></select>
      </div>
      <label class="check"><input type="checkbox" id="l-static"> Same on every frame (for backgrounds)</label>
      <div class="mini-grid three">
        <button class="mini" id="l-up" title="Move the selected layer up the stack">Move up</button>
        <button class="mini" id="l-down" title="Move the selected layer down the stack">Move down</button>
        <button class="mini" id="l-rename" title="Rename the selected layer">Rename</button>
      </div>
    </div>
  </div>

  <!-- ===== Pop-out panel: onion skin settings ===== -->
  <div class="panel" id="panel-onion" hidden>
    <h2>Onion skin</h2>
    <div class="field">
      <label for="o-prev">Before</label>
      <input type="range" id="o-prev" min="0" max="3">
      <output id="o-prev-out"></output>
    </div>
    <div class="field">
      <label for="o-next">After</label>
      <input type="range" id="o-next" min="0" max="3">
      <output id="o-next-out"></output>
    </div>
    <div class="field">
      <label for="o-opacity">Strength</label>
      <input type="range" id="o-opacity" min="5" max="80">
      <output id="o-opacity-out"></output>
    </div>
    <p class="hint">Earlier frames show in <b class="red">red</b>, later frames in <b class="green">green</b>.
      Layers set to "same on every frame" aren't shown.</p>
  </div>

  <!-- ===== Pop-out panel: color wheel ===== -->
  <div class="panel" id="panel-color" hidden>
    <h2>Color</h2>
    <div id="color-picker"></div>
  </div>

  <div id="toast" role="status" aria-live="polite"></div>

  <script src="js/color.js"></script>
  <script src="js/history.js"></script>
  <script src="js/brushes.js"></script>
  <script src="js/blendtool.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
